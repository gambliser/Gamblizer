```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamblaizer | Smart Bet Analyzer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#020617);
    color:white;
}

/* Header */
header{
    text-align:center;
    padding:30px;
}

header h1{
    font-size:4rem;
    color:#00ffcc;
    text-shadow:0 0 20px #00ffcc;
}

header p{
    color:#cbd5e1;
    font-size:1.1rem;
}

/* Main Container */
.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* Glass Cards */
.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-8px);
}

h2{
    color:#00ffcc;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:15px;
    margin-top:10px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#0f172a;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00ffcc;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#22d3ee;
    transform:scale(1.03);
}

.result{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:rgba(0,255,204,0.1);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-box{
    background:rgba(255,255,255,0.08);
    padding:25px;
    border-radius:20px;
    text-align:center;
}

.stat-box h3{
    color:#00ffcc;
    font-size:2rem;
}

footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
}

</style>
</head>
<body>

<header>
    <h1>GAMBLAIZER</h1>
    <p>Smart Bet Calculator & Analyzer</p>
</header>

<div class="container">

    <div class="stats">
        <div class="stat-box">
            <h3>AI</h3>
            <p>Bet Analysis</p>
        </div>

        <div class="stat-box">
            <h3>24/7</h3>
            <p>Instant Calculations</p>
        </div>

        <div class="stat-box">
            <h3>100%</h3>
            <p>Live Odds Support</p>
        </div>
    </div>

    <div class="card">
        <h2>Bet Calculator</h2>

        <input type="number" id="stake" placeholder="Stake Amount">
        <input type="number" id="odds" placeholder="Decimal Odds">

        <button onclick="calculateBet()">
            Calculate Potential Winnings
        </button>

        <div id="betResult" class="result"></div>
    </div>

    <div class="card">
        <h2>Smart Bet Analyzer</h2>

        <input type="number" id="probability"
        placeholder="Estimated Probability (%)">

        <button onclick="analyzeBet()">
            Analyze Bet
        </button>

        <div id="analysisResult" class="result"></div>
    </div>

</div>

<footer>
    © 2026 Gamblaizer | Smart Analytics Platform
</footer>

<script>

function calculateBet(){

let stake = parseFloat(document.getElementById('stake').value);
let odds = parseFloat(document.getElementById('odds').value);

if(!stake || !odds){
document.getElementById('betResult').innerHTML =
"Please enter valid values.";
return;
}

let payout = stake * odds;
let profit = payout - stake;

document.getElementById('betResult').innerHTML =

`<h3>Results</h3>
Potential Payout: R${payout.toFixed(2)}<br>
Potential Profit: R${profit.toFixed(2)}`;
}

function analyzeBet(){

let odds = parseFloat(document.getElementById('odds').value);
let probability = parseFloat(document.getElementById('probability').value);

if(!odds || !probability){
document.getElementById('analysisResult').innerHTML =
"Please enter valid values.";
return;
}

let implied = (1/odds)*100;
let edge = probability - implied;

let rating = "High Risk";

if(edge > 10){
rating = "Lower Risk";
}
else if(edge > 0){
rating = "Medium Risk";
}

document.getElementById('analysisResult').innerHTML =

`<h3>Analysis</h3>
Implied Probability: ${implied.toFixed(2)}%<br>
Value Edge: ${edge.toFixed(2)}%<br>
Risk Level: ${rating}`;
}

</script>

</body>
</html>
```
